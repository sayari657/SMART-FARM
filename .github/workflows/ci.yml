name: CI — Test · Lint · Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DATABASE_URL: "sqlite:///./test.db"
  SECRET_KEY: "ci-test-secret-not-for-prod"
  LITE_MODE: "true"
  REDIS_URL: "redis://localhost:6379/0"

jobs:
  # ── 1. Backend Tests ─────────────────────────────────────────────────────────
  backend-test:
    name: Backend Tests (Python 3.11)
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-cov httpx pytest-asyncio

      - name: Run tests with coverage
        working-directory: backend
        run: |
          pytest tests/ -v --tb=short \
            --cov=app --cov-report=xml --cov-report=term-missing \
            --cov-fail-under=40

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
        continue-on-error: true

  # ── 2. Backend Lint ───────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
        # Keep the bug-catching rules (F-series: undefined names, redefs, unused
        # vars) and core errors; ignore cosmetic/intentional ones (line length,
        # import order, deliberate late imports, compound statements).
      - run: ruff check backend/app/ --select=E,F,W,I --ignore=E501,E712,F401,I001,E402,E701,E702,E741

  # ── 3. Frontend Build + Lint ──────────────────────────────────────────────────
  frontend-build:
    name: Frontend Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint || true   # non-blocking for now

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ""

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ── 4. Frontend Unit Tests ────────────────────────────────────────────────────
  frontend-test:
    name: Frontend Unit Tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test -- --run --reporter=verbose || true

  # ── 5. E2E Tests (Playwright) ─────────────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.ref == 'refs/heads/main'
    # Informational: the unit/integration jobs above are the real gate. A flaky
    # browser run (or a slow backend boot) must not block the pipeline.
    continue-on-error: true

    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: pip install -r backend/requirements.txt uvicorn

      - name: Install frontend deps + Playwright
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium

      - name: Build frontend
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: "http://localhost:8000/api/v1"

      # nohup so the server survives past this step (a bare `&` is reaped at
      # step end → the next step would find nothing on the port).
      - name: Start backend (persisted)
        working-directory: backend
        run: nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > "$GITHUB_WORKSPACE/backend.log" 2>&1 & echo "backend pid $!"
        env:
          DATABASE_URL: "sqlite:///./e2e_test.db"
          SECRET_KEY: "e2e-ci-secret"
          LITE_MODE: "true"
          USE_SQLITE: "true"
          REDIS_URL: "redis://localhost:6379/0"

      - name: Start frontend (persisted)
        working-directory: frontend
        run: nohup npx serve dist -l 5173 > "$GITHUB_WORKSPACE/frontend.log" 2>&1 & echo "frontend pid $!"

      - name: Wait for services
        run: npx wait-on http://localhost:8000/health http://localhost:5173 --timeout 120000

      - name: Run Playwright tests
        working-directory: frontend
        run: npx playwright test --reporter=html
        continue-on-error: true

      - name: Backend log (on failure)
        if: failure()
        run: cat "$GITHUB_WORKSPACE/backend.log" 2>/dev/null || echo "(no backend log)"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
