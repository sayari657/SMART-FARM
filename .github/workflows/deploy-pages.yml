name: Deploy — Cloudflare Pages (frontend)

# Builds the React app and publishes it to the Cloudflare Pages project `farmai`
# (farmai-7ye.pages.dev) — the real frontend deployment for this project.
#
# Enable by setting, in the GitHub repo:
#   • Variable  CF_DEPLOY        = true
#   • Variable  VITE_API_URL     = https://<backend>/api/v1   (optional)
#   • Variable  VITE_WS_URL      = wss://<backend>            (optional)
#   • Secret    CLOUDFLARE_API_TOKEN   (Pages:Edit permission)
#   • Secret    CLOUDFLARE_ACCOUNT_ID
# Without the CF_DEPLOY variable the job is skipped, so it never fails the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-pages:
    name: Build & publish to Cloudflare Pages
    runs-on: ubuntu-latest
    if: ${{ vars.CF_DEPLOY == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_WS_URL: ${{ vars.VITE_WS_URL }}

      - name: Strip files larger than 25 MiB (Cloudflare Pages limit)
        run: find frontend/dist -type f -size +25M -delete

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy frontend/dist --project-name=farmai --branch=main
