listener 1883
listener 9001
protocol websockets

# ── DEV ONLY ──────────────────────────────────────────────────────────────
# Anonymous access is acceptable on a trusted LAN / local docker network.
# NEVER expose port 1883 to the Internet with allow_anonymous true.
allow_anonymous true

# ── PRODUCTION HARDENING (uncomment + provision) ─────────────────────────
# 1. Create users:  mosquitto_passwd -c /mosquitto/config/passwd node_a
#                   mosquitto_passwd    /mosquitto/config/passwd node_b
#                   mosquitto_passwd    /mosquitto/config/passwd backend
# 2. Enable auth + per-node topic ACL:
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/mosquitto.acl
# 3. If exposed beyond the LAN, add TLS:
# listener 8883
# certfile /mosquitto/certs/server.crt
# keyfile  /mosquitto/certs/server.key
# cafile   /mosquitto/certs/ca.crt

persistence true
persistence_location /mosquitto/data/
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
