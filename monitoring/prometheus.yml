global:
  scrape_interval:     15s   # scrape every 15 seconds
  evaluation_interval: 15s

scrape_configs:

  # ── Smart Farm AI FastAPI Backend ─────────────────────────────────────────
  - job_name: "smart_farm_api"
    metrics_path: "/metrics"
    static_configs:
      # localhost:8000 for native binary; use host.docker.internal:8000 inside Docker
      - targets: ["localhost:8000"]
        labels:
          app: "smart_farm_ai"
          env: "dev"

  # ── Prometheus self-monitoring ─────────────────────────────────────────────
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
