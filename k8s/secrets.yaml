apiVersion: v1
kind: Secret
metadata:
  name: smart-farm-secrets
type: Opaque
stringData:
  SECRET_KEY:      "REPLACE_WITH_REAL_KEY"
  DATABASE_URL:    "postgresql+psycopg2://farmuser:PASSWORD@postgres:5432/smart_farm"
  GROQ_API_KEY:    "REPLACE_WITH_REAL_GROQ_KEY"
  SMTP_PASSWORD:   "REPLACE_WITH_APP_PASSWORD"
  WHATSAPP_TOKEN:  "REPLACE_WITH_META_TOKEN"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ai-assets-pvc
spec:
  accessModes: [ReadOnlyMany]
  resources:
    requests:
      storage: 20Gi
