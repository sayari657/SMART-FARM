# FARM AI — Production Docker Compose
# Runs the full stack: PostgreSQL/PostGIS + FastAPI backend + nginx/React frontend.
#
# QUICK START
#   1. cp .env.production.example .env.production   (fill in secrets)
#   2. docker compose --env-file .env.production up -d --build
#   3. Open http://<server-ip>  (or your domain if Caddy/nginx is in front)
#
# HTTPS WITH A DOMAIN (Caddy — zero-config SSL)
#   See the caddy service block at the bottom. Uncomment it and set
#   DOMAIN= in .env.production to get automatic Let's Encrypt certs.
#
# LITE MODE (SQLite instead of PostgreSQL — simpler but single-instance only)
#   Set DATABASE_URL=sqlite:////data/smart_farm.db in .env.production
#   and remove/comment out the db service and the db dependency.

services:

  # ── Redis (caching + sessions) ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --save ""
    expose:
      - "6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ── Mosquitto MQTT Broker ──────────────────────────────────────────────────
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"    # WebSocket MQTT (browser clients)
    volumes:
      - ./monitoring/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t health -m ping -q 0 2>/dev/null && echo ok"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ── ChromaDB (RAG souverain — embeddings MiniLM) ──────────────────────────
  chroma:
    image: chromadb/chroma:latest
    restart: unless-stopped
    volumes:
      - chroma_data:/data
    expose:
      - "8000"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8000 && echo ok' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── PostgreSQL + PostGIS ───────────────────────────────────────────────────
  db:
    image: postgis/postgis:16-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME:-smart_farm}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-admin} -d ${DB_NAME:-smart_farm}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_started
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD}@db:5432/${DB_NAME:-smart_farm}
      REDIS_URL:    "redis://redis:6379/0"
      MQTT_BROKER:  "mosquitto"
      MQTT_PORT:    "1883"
      CHROMA_HOST:  "chroma"
      CHROMA_PORT:  "8000"
    volumes:
      - ./iot:/app/iot:ro              # IoT CSV files (read-only)
      - sqlite_data:/data              # used only in SQLite mode
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    # No --reload in production
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  # ── React Frontend (nginx) ─────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # VITE_API_URL intentionally empty → relative /api/v1 paths
      # nginx proxies them to the backend container internally
      args:
        VITE_API_URL: ""
        VITE_WS_URL:  "${VITE_WS_URL:-}"
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"      # HTTP — put Caddy in front for HTTPS

  # ── Caddy (automatic HTTPS) — uncomment when you have a domain ─────────────
  # caddy:
  #   image: caddy:2-alpine
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   depends_on:
  #     - frontend
  #     - backend

volumes:
  postgres_data:
  sqlite_data:
  mosquitto_data:
  mosquitto_log:
  chroma_data:
  # caddy_data:
  # caddy_config:
