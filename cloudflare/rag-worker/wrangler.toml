name = "farmai-rag"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Workers AI — embeddings (bge-m3, multilingual FR/AR) + LLM (Llama 3.1)
[ai]
binding = "AI"

# Vectorize — sovereign knowledge base vector index
[[vectorize]]
binding = "VECTORIZE"
index_name = "farmai-knowledge"

# INGEST_TOKEN is set as a secret:  npx wrangler secret put INGEST_TOKEN
